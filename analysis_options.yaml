# Standard Flutter lints plus a small set of project conventions.
include: package:flutter_lints/flutter.yaml

# riverpod_lint enforces correct ref/provider usage (e.g. no ref.read inside
# build, no ref use after dispose). Do not disable rules globally; if a single
# rule must be ignored, use a narrow `// ignore: <rule>` with a reason.
plugins:
  riverpod_lint: ^3.2.0

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # Generated by build_runner; regenerate instead of editing.
    - "**/*.g.dart"
  errors:
    # Use AppLogger (lib/core/logging) instead of print().
    avoid_print: error

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - unawaited_futures
    - always_declare_return_types
